<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- {{TITLE}} — подставить заголовок темы -->
  <title>{{TITLE}}</title>
  <style>
    :root{
      --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --txt:#e6e8ec; --mut:#9aa3b2;
      --acc:#d97757; --acc2:#7aa2f7; --ok:#7bd88f; --code:#11141a;
      --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,monospace;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);
      line-height:1.7;font-size:16px}
    .wrap{max-width:860px;margin:0 auto;padding:0 20px}
    header{padding:56px 0 28px;border-bottom:1px solid var(--line);
      background:radial-gradient(1000px 360px at 18% -10%,rgba(217,119,87,.14),transparent 60%)}
    .badge{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--acc);
      border:1px solid var(--acc);border-radius:999px;padding:4px 12px}
    h1{font-size:clamp(26px,4vw,38px);margin:16px 0 0;letter-spacing:-.02em;line-height:1.15}
    main{padding:32px 0 64px}
    h2{font-size:23px;margin:38px 0 10px;padding-top:8px;border-top:1px solid var(--line)}
    h2:first-child{border-top:0}
    h3{font-size:18px;margin:24px 0 8px}
    a{color:var(--acc2)}
    .tldr{background:linear-gradient(135deg,rgba(217,119,87,.12),rgba(122,162,247,.07));
      border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:12px;
      padding:16px 18px;color:var(--txt);margin:24px 0}
    blockquote{margin:14px 0;padding:10px 16px;border-left:3px solid var(--acc2);
      background:var(--panel);border-radius:8px;color:var(--mut)}
    code{font-family:var(--mono);font-size:13.5px;color:var(--acc2);
      background:var(--code);padding:2px 6px;border-radius:5px}
    pre.mermaid{background:var(--panel);border:1px solid var(--line);border-radius:14px;
      padding:22px;margin:20px 0;text-align:center;overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:15px;margin:14px 0}
    th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
    th{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
    ul,ol{padding-left:22px} li{margin:5px 0}
    .toc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
    .toc ul{margin:6px 0;list-style:none;padding-left:0}
    .toc a{text-decoration:none}
    footer{border-top:1px solid var(--line);padding:24px 0 64px;color:var(--mut);
      font-size:13px;font-family:var(--mono)}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <span class="badge">КОНСПЕКТ</span>
      <!-- {{TITLE}} -->
      <h1>{{TITLE}}</h1>
    </div>
  </header>

  <main class="wrap">
    <!-- {{BODY}} — сюда вставить тело конспекта в HTML:
         TL;DR -> <div class="tldr">…</div>
         разделы -> <h2 id="...">…</h2> + <ul>/<p>/<table>
         диаграммы -> <pre class="mermaid">…синтаксис Mermaid…</pre>
         оглавление -> <div class="toc">…</div>
    -->
    {{BODY}}
  </main>

  <footer class="wrap">
    Сгенерировано скиллом <code>transcript-to-notes</code> • диаграммы — Mermaid
  </footer>

  <!-- Рендер Mermaid-диаграмм прямо в браузере, без сборки -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true, theme: 'dark', securityLevel: 'loose' });
  </script>
</body>
</html>
