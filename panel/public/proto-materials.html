<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Прототип: База знаний — Vibe Portal</title>
  <link rel="icon" type="image/png" href="/KG_fi.png" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    (function () {
      var t = localStorage.getItem('aif-theme');
      if (t !== 'light') document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    .proto-bar {
      position: sticky; top: 0; z-index: 50;
      background: hsl(var(--smui-surface-1));
      border-bottom: 1px solid hsl(var(--border));
      padding: 10px 18px;
    }
    .proto-bar-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .proto-bar-tag {
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      color: hsl(var(--smui-yellow)); border: 1px solid hsl(var(--smui-yellow) / .4);
      padding: 3px 8px; white-space: nowrap;
    }
    .proto-bar-title { font-size: 12.5px; color: hsl(var(--muted-foreground)); }
    .proto-bar-title strong { color: hsl(var(--foreground)); }
    .proto-bar-title .pill {
      display:inline-block; padding:1px 7px; margin-left:6px; font-size:11px;
      border:1px solid hsl(var(--primary)); color:hsl(var(--accent-foreground)); background:hsl(var(--accent));
    }
    .proto-stage { max-width: 1120px; margin: 16px auto 60px; padding: 0 22px; }

    /* фейковый навбар */
    .mini-nav {
      display: flex; align-items: center; gap: 8px;
      border: 1px solid hsl(var(--border)); background: hsl(var(--smui-surface-1));
      padding: 8px 12px; margin-bottom: 18px;
    }
    .mini-nav .kg { font-weight: 700; letter-spacing: .08em; color: hsl(var(--primary)); border: 1px solid hsl(var(--border)); padding: 3px 7px; font-size: 12px; }
    .mini-nav .sp { flex: 1; }
    .mini-tab { font-size: 12px; padding: 5px 11px; border: 1px solid transparent; color: hsl(var(--muted-foreground)); display: flex; gap: 6px; align-items: center; }
    .mini-tab.is-new { color: hsl(var(--foreground)); border-color: hsl(var(--primary)); background: hsl(var(--accent)); }
    .mini-tab.is-new .dot { color: hsl(var(--smui-green)); }
    .mini-nav .ico { width: 22px; height: 22px; border: 1px solid hsl(var(--border)); display: inline-block; }

    /* поиск */
    .ms-search { display: flex; align-items: center; gap: 10px; border: 1px solid hsl(var(--border)); background: hsl(var(--smui-surface-1)); padding: 9px 13px; margin-bottom: 16px; }
    .ms-search input { flex: 1; background: transparent; border: none; outline: none; color: hsl(var(--foreground)); font-family: var(--font-mono); font-size: 13px; }
    .ms-search .k { font-size: 11px; color: hsl(var(--muted-foreground)); border: 1px solid hsl(var(--border)); padding: 1px 6px; }

    /* хаб: сайдбар + контент */
    .hub { display: grid; grid-template-columns: 234px 1fr; gap: 20px; align-items: start; }
    .hub-side { border: 1px solid hsl(var(--border)); background: hsl(var(--smui-surface-1)); position: sticky; top: 70px; }
    .hub-group-h {
      padding: 11px 13px 6px; font-size: 10px; letter-spacing: .13em; text-transform: uppercase;
      color: hsl(var(--muted-foreground)); opacity: .8;
    }
    .hub-group-h:not(:first-child) { border-top: 1px solid hsl(var(--border)); margin-top: 4px; }
    .hub-item {
      display: flex; align-items: center; gap: 9px; padding: 8px 13px; cursor: pointer;
      font-size: 13px; color: hsl(var(--muted-foreground)); border-left: 2px solid transparent;
    }
    .hub-item:hover { background: hsl(var(--smui-surface-2)); }
    .hub-item.active { color: hsl(var(--foreground)); border-left-color: hsl(var(--primary)); background: hsl(var(--accent)); }
    .hub-item .n { margin-left: auto; font-size: 11px; opacity: .55; }
    .hub-item.sub { padding-left: 26px; font-size: 12.5px; }
    .hub-item.strong { color: hsl(var(--foreground)); }

    /* секция-вид по типу внутри модуля */
    .kind-sect { margin: 0 0 26px; }
    .kind-head { display: flex; align-items: center; gap: 9px; padding-bottom: 10px; border-bottom: 1px solid hsl(var(--border)); margin-bottom: 14px; }
    .kind-head .ico { font-size: 17px; }
    .kind-head .t { font-size: 14px; font-weight: 600; color: hsl(var(--foreground)); }
    .kind-head .n { font-size: 11px; color: hsl(var(--muted-foreground)); }
    .kind-head .add { margin-left: auto; font-size: 11px; color: hsl(var(--primary)); border: 1px dashed hsl(var(--primary) / .5); padding: 2px 9px; cursor: pointer; }
    .mod-sub { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: hsl(var(--muted-foreground)); margin: 4px 0 12px; }

    /* карточки */
    .ms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 14px; }
    .ms-card { border: 1px solid hsl(var(--border)); background: hsl(var(--card)); padding: 14px 15px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: border-color .12s, transform .12s; }
    .ms-card:hover { border-color: hsl(var(--smui-border-hover)); transform: translateY(-2px); }
    .ms-card-top { display: flex; align-items: center; gap: 9px; }
    .ms-card-ico { font-size: 18px; line-height: 1; }
    .ms-card-type { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: hsl(var(--muted-foreground)); margin-left: auto; border: 1px solid hsl(var(--border)); padding: 2px 6px; }
    .ms-card-title { font-size: 13.5px; font-weight: 600; color: hsl(var(--foreground)); line-height: 1.3; }
    .ms-card-desc { font-size: 12px; color: hsl(var(--muted-foreground)); line-height: 1.5; flex: 1; }
    .ms-card-meta { font-size: 11px; color: hsl(var(--smui-frost-3)); }
    .ms-card-foot { display: flex; align-items: center; gap: 8px; font-size: 11px; color: hsl(var(--muted-foreground)); }
    .ms-card-cta { color: hsl(var(--primary)); margin-left: auto; }
    .badge-new { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: hsl(var(--smui-green)); border: 1px solid hsl(var(--smui-green) / .45); padding: 1px 5px; }
    .badge-due { font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: hsl(var(--smui-orange)); border: 1px solid hsl(var(--smui-orange) / .45); padding: 1px 5px; }

    .empty { color: hsl(var(--muted-foreground)); font-size: 12.5px; padding: 22px; text-align: center; border: 1px dashed hsl(var(--border)); }
    .hint { font-size: 11.5px; color: hsl(var(--muted-foreground)); margin: -6px 0 18px; line-height: 1.55; }
    .hint code { color: hsl(var(--smui-frost-2)); }

    @media (max-width: 760px) {
      .hub { grid-template-columns: 1fr; }
      .hub-side { position: static; }
    }
  </style>
</head>
<body class="app-bg">

  <div class="proto-bar">
    <div class="proto-bar-row">
      <span class="proto-bar-tag">прототип</span>
      <span class="proto-bar-title">
        <strong>Вариант A — Хаб «База знаний»</strong><span class="pill">выбран</span>
        · по модулям: материалы · домашки · мастер-классы + сквозной вид «всё сразу»
      </span>
    </div>
  </div>

  <div class="proto-stage">
    <div class="mini-nav">
      <span class="kg">KG</span>
      <span class="mini-tab">VS Code</span>
      <span class="mini-tab">Проекты</span>
      <span class="mini-tab is-new"><span class="dot">●</span> База знаний</span>
      <span class="sp"></span>
      <span class="ico"></span><span class="ico"></span>
    </div>

    <div class="ms-search">
      <span>🔎</span>
      <input id="search" placeholder="Поиск: «домашка модуль 1», «CLAUDE.md», «запись мастер-класса»…" />
      <span class="k">/</span>
    </div>

    <div class="hub">
      <aside class="hub-side" id="side"></aside>
      <main id="content"></main>
    </div>
  </div>

  <script>
  /* ════════════════════════════════════════════════════════════
   * ЕДИНЫЙ РЕЕСТР. Чтобы добавить материал/домашку/мастер-класс —
   * Claude дописывает ОДИН объект сюда (в проде — manifest + папка
   * content/). Поля: kind (тип), module (к какому модулю, если по
   * программе), всё остальное — для карточки.
   *
   *  kind по модулям:  material · homework · masterclass
   *  kind глобальные:  start · cheatsheet · template · link · skill · faq
   * ════════════════════════════════════════════════════════════ */
  const KIND = {
    start:       { icon:'🚀', label:'С чего начать',     tag:'гайд' },
    material:    { icon:'📚', label:'Материалы',         tag:'материал' },
    homework:    { icon:'📝', label:'Домашние задания',  tag:'дз' },
    masterclass: { icon:'🎥', label:'Мастер-классы',     tag:'запись' },
    cheatsheet:  { icon:'📋', label:'Шпаргалки',         tag:'шпаргалка' },
    template:    { icon:'📦', label:'Шаблоны',           tag:'шаблон' },
    link:        { icon:'🔗', label:'Ссылки',            tag:'ссылка' },
    skill:       { icon:'✨', label:'Скиллы',            tag:'скилл' },
    faq:         { icon:'⚠',  label:'FAQ',               tag:'faq' },
  };
  const MODULES = [
    { n:1, title:'Основы Claude и портала' },
    { n:2, title:'Работа с CLAUDE.md и контекстом' },
  ];
  // порядок типов внутри модуля
  const MOD_KINDS = ['material', 'homework', 'masterclass'];
  // что относится к «Справочнику» (вне модулей)
  const REF_KINDS = ['cheatsheet', 'template', 'link', 'skill', 'faq'];

  const M = [
    // ─────── МОДУЛЬ 1 ───────
    { kind:'material', module:1, icon:'📖', title:'Конспект: Что такое Claude', desc:'Модель в дата-центре, 3 способа обращения, сравнение с ChatGPT/Cursor/Codex.', cta:'Читать' },
    { kind:'material', module:1, icon:'📖', title:'Конспект: Воркспейс и контейнер', desc:'Как устроен твой контейнер, маунты workspace / templates / skills.', cta:'Читать' },
    { kind:'material', module:1, icon:'🖼', title:'Слайды модуля 1', desc:'Презентация с мастер-классов 27–28.05. PDF под печать.', cta:'↓ Скачать', isNew:true },
    { kind:'homework', module:1, icon:'📝', title:'ДЗ-1: Создай проект из шаблона', desc:'Создай проект из _base, разбери CLAUDE.md, запусти VS Code.', cta:'Открыть задание', due:'срок 02.06' },
    { kind:'homework', module:1, icon:'📝', title:'ДЗ-2: Опубликуй приложение', desc:'Включи публикацию, выбери видимость, пришли ссылку.', cta:'Открыть задание', due:'срок 05.06' },
    { kind:'masterclass', module:1, icon:'🎥', title:'Запись МК 27.05 — основы', desc:'Полная запись первого мастер-класса. ~1ч40м.', cta:'Смотреть запись' },
    { kind:'masterclass', module:1, icon:'🎥', title:'Запись МК 28.05 — деплой', desc:'Публикация и показ приложения клиенту. ~1ч10м.', cta:'Смотреть запись', isNew:true },

    // ─────── МОДУЛЬ 2 ───────
    { kind:'material', module:2, icon:'📖', title:'Конспект: CLAUDE.md и память', desc:'Зачем нужен CLAUDE.md, как писать правила, что такое MEMORY.md.', cta:'Читать', isNew:true },
    { kind:'homework', module:2, icon:'📝', title:'ДЗ-3: Напиши CLAUDE.md', desc:'Составь CLAUDE.md для своего проекта по чек-листу.', cta:'Открыть задание', due:'срок 09.06', isNew:true },
    // мастер-классов модуля 2 пока нет — секция покажет «пока пусто»

    // ─────── ГЛОБАЛЬНОЕ: старт ───────
    { kind:'start', icon:'🧭', title:'Как работать с порталом', desc:'Пошагово: вход, навбар, VS Code, проект, чат с Claude, файлы, контейнер.', cta:'Открыть гайд' },
    { kind:'start', icon:'🚀', title:'Как опубликовать приложение', desc:'Публикация, кто видит, деплой, относительные пути к ассетам.', cta:'Открыть гайд' },

    // ─────── СПРАВОЧНИК ───────
    { kind:'cheatsheet', icon:'📋', title:'Шпаргалка по Claude Code', desc:'Горячие клавиши, slash-команды, Agent View, флаги CLI. Под печать A4.', cta:'Открыть' },
    { kind:'cheatsheet', icon:'📝', title:'.md и CLAUDE.md — что это', desc:'Учебная мини-страница: что такое Markdown и зачем нужен CLAUDE.md.', cta:'Открыть', isNew:true },
    { kind:'template', icon:'🪄', title:'Vibe шаблон (_base)', desc:'Каркас vibe-проекта на Node: src/, deploy, CLAUDE.md с онбордингом.', cta:'↓ .zip · CLAUDE.md' },
    { kind:'template', icon:'🟦', title:'PHP шаблон (Битрикс24)', desc:'Single-PHP приложение Б24: www/, REST-обвязка, deploy-скрипт.', cta:'↓ .zip · CLAUDE.md' },
    { kind:'link', icon:'🤖', title:'claude.ai', desc:'Логин в основной аккаунт Claude — диалоги, проекты.', cta:'Перейти →' },
    { kind:'link', icon:'🧰', title:'VS Code (десктоп)', desc:'Локальная установка редактора для офлайн-работы.', cta:'Перейти →' },
    { kind:'link', icon:'📦', title:'Vibecode Bitrix24', desc:'Платформа деплоя и аналитики приложений Б24.', cta:'Перейти →' },
    { kind:'skill', icon:'✨', title:'superpowers', desc:'Общие практики: brainstorming, planning, debugging, code-review, TDD.', cta:'github →' },
    { kind:'skill', icon:'🎨', title:'ui-ux-pro-max', desc:'Frontend и UI: дизайн-система, типографика, доступность, layout.', cta:'github →' },
    { kind:'faq', icon:'⚠', title:'«Вылетает / не пускает» — почему', desc:'Чаще всего это вход на dev-портал вместо vibe или уснувший контейнер.', cta:'Открыть' },
  ];

  const byKind = (k, mod) => M.filter(m => m.kind === k && (mod == null || m.module === mod));
  const cnt = (k, mod) => byKind(k, mod).length;

  /* ── карточка ── */
  function card(m) {
    return `<div class="ms-card">
      <div class="ms-card-top">
        <span class="ms-card-ico">${m.icon}</span>
        <span class="ms-card-type">${KIND[m.kind].tag}</span>
      </div>
      <div class="ms-card-title">${m.title}</div>
      <div class="ms-card-desc">${m.desc}</div>
      ${m.due ? `<div class="ms-card-meta">⏱ ${m.due}</div>` : ''}
      <div class="ms-card-foot">
        ${m.isNew ? '<span class="badge-new">новое</span>' : ''}
        ${m.kind === 'homework' ? '<span class="badge-due">дз</span>' : ''}
        <span class="ms-card-cta">${m.cta || 'Открыть'} →</span>
      </div>
    </div>`;
  }
  const grid = (items) => items.length ? `<div class="ms-grid">${items.map(card).join('')}</div>` : '<div class="empty">Пока пусто — здесь появится материал, как только добавим.</div>';

  /* ── сайдбар ── */
  let active = 'mod:1';
  function renderSide() {
    let h = '<div class="hub-group-h">База знаний</div>';
    h += item('start', '🚀', 'С чего начать', cnt('start'));

    h += '<div class="hub-group-h">По модулям</div>';
    MODULES.forEach(mo => {
      const total = MOD_KINDS.reduce((s,k)=>s+cnt(k,mo.n),0);
      h += item('mod:'+mo.n, '📦', 'Модуль '+mo.n, total, true);
    });

    h += '<div class="hub-group-h">Всё сразу</div>';
    h += item('all:material',    '📚', 'Все материалы',      cnt('material'));
    h += item('all:homework',    '📝', 'Все домашние задания', cnt('homework'));
    h += item('all:masterclass', '🎥', 'Все мастер-классы',  cnt('masterclass'));

    h += '<div class="hub-group-h">Справочник</div>';
    REF_KINDS.forEach(k => h += item('ref:'+k, KIND[k].icon, KIND[k].label, cnt(k)));

    document.getElementById('side').innerHTML = h;
    document.querySelectorAll('#side .hub-item').forEach(el => el.onclick = () => { active = el.dataset.id; document.getElementById('search').value=''; render(); });
  }
  function item(id, icon, label, n, strong) {
    return `<div class="hub-item ${strong?'strong':''} ${active===id?'active':''}" data-id="${id}">
      <span>${icon}</span><span>${label}</span><span class="n">${n}</span></div>`;
  }

  /* ── контент ── */
  function pageHead(meta, title) {
    return `<div class="page-meta">${meta}</div><h1 class="page-h1">${title}</h1>`;
  }
  function kindSect(k, mod) {
    const items = byKind(k, mod);
    return `<div class="kind-sect">
      <div class="kind-head">
        <span class="ico">${KIND[k].icon}</span>
        <span class="t">${KIND[k].label}</span>
        <span class="n">${items.length}</span>
        <span class="add">+ добавить</span>
      </div>
      ${grid(items)}
    </div>`;
  }

  function render(q) {
    const c = document.getElementById('content');
    q = (q || '').trim().toLowerCase();

    // поиск — поверх всего, плоской сеткой
    if (q) {
      const items = M.filter(m => (m.title+m.desc+(KIND[m.kind].label)).toLowerCase().includes(q));
      c.innerHTML = pageHead('ПОИСК · «'+q+'»', 'Найдено: <em>'+items.length+'</em>') + grid(items);
      document.querySelectorAll('#side .hub-item').forEach(el => el.classList.remove('active'));
      return;
    }

    if (active.startsWith('mod:')) {
      const n = +active.split(':')[1];
      const mo = MODULES.find(m => m.n === n);
      c.innerHTML = pageHead('БАЗА ЗНАНИЙ · МОДУЛЬ '+n, '📦 Модуль '+n+' — <em>'+mo.title+'</em>')
        + '<p class="hint">Всё по модулю в одном месте: конспекты, домашки и записи мастер-классов. Добавляешь любой тип кнопкой <code>+ добавить</code> — он попадёт ровно сюда и заодно в сквозной вид «Всё сразу».</p>'
        + MOD_KINDS.map(k => kindSect(k, n)).join('');
    }
    else if (active.startsWith('all:')) {
      const k = active.split(':')[1];
      let html = pageHead('БАЗА ЗНАНИЙ · СКВОЗНОЙ ВИД', KIND[k].icon+' Все '+KIND[k].label.toLowerCase())
        + '<p class="hint">Один список со всех модулей сразу — удобно проверить, что ничего не забыто.</p>';
      MODULES.forEach(mo => {
        const items = byKind(k, mo.n);
        html += `<div class="mod-sub">Модуль ${mo.n} · ${mo.title}</div>` + grid(items);
      });
      c.innerHTML = html;
    }
    else if (active.startsWith('ref:')) {
      const k = active.split(':')[1];
      c.innerHTML = pageHead('СПРАВОЧНИК · '+KIND[k].label.toUpperCase(), KIND[k].icon+' '+KIND[k].label) + grid(byKind(k));
    }
    else if (active === 'start') {
      c.innerHTML = pageHead('БАЗА ЗНАНИЙ · СТАРТ', '🚀 С чего начать')
        + '<p class="hint">Минимум, чтобы начать работать. Дальше — по модулям слева.</p>' + grid(byKind('start'));
    }
    renderSide();
  }

  document.getElementById('search').oninput = (e) => render(e.target.value);

  renderSide();
  render();
  </script>
</body>
</html>
